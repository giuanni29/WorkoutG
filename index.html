<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker Pro</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #00adb5;
            --orange: #ff9800;
            --green: #4caf50;
            --red: #ff4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: var(--bg);
            color: #fff;
            padding: 15px;
            overflow-x: hidden;
        }
        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }
        .header h2 { color: var(--accent); font-size: 1.2em; white-space: nowrap; }
        .hbtns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        .btn-outline {
            background: #2a2a2a;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75em;
            white-space: nowrap;
        }
        .btn-prog {
            background: #2a2a2a;
            border: 1px solid var(--orange);
            color: var(--orange);
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75em;
            white-space: nowrap;
        }
        .btn-prog.active { background: var(--orange); color: #000; }

        /* EXERCISE CARD */
        .ex-card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .ex-info { flex: 1; min-width: 0; }
        .name-row { display: flex; align-items: center; gap: 6px; }
        .ex-name {
            font-weight: bold;
            font-size: 1em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .ex-name.prog { color: var(--orange); }
        .badge {
            background: var(--accent);
            color: #000;
            font-size: 0.65em;
            font-weight: bold;
            border-radius: 50%;
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .badge.hide { display: none; }
        .last-w { font-size: 0.78em; color: #888; margin-top: 3px; }

        .input-row { display: flex; gap: 5px; align-items: center; }
        input[type="number"] {
            width: 72px;
            background: #2a2a2a;
            border: 1px solid #555;
            color: var(--accent);
            padding: 10px 4px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            outline: none;
        }
        .check-btn {
            background: #2a2a2a;
            border: 1px solid #555;
            color: var(--green);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }

        /* SET DOTS */
        .dots-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .dot {
            width: 30px; height: 26px;
            border-radius: 6px;
            background: #2a2a2a;
            border: 1px solid #444;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65em;
            color: #666;
            font-weight: bold;
        }
        .dot.done { background: var(--green); border-color: var(--green); color: #000; }
        .dot.prog-done { background: var(--orange); border-color: var(--orange); color: #000; }

        /* SAVE BTN */
        .save-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .save-btn.ok { background: var(--green); }

        /* VIEWS */
        #view-main, #view-manage, #view-history { display: none; }
        #view-main { display: block; }

        /* MANAGE */
        .manage-item {
            background: var(--card);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .manage-item span { flex: 1; font-size: 0.95em; }
        .btn-edit {
            background: #2a2a2a;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72em;
            cursor: pointer;
        }
        .btn-del {
            background: #2a2a2a;
            border: 1px solid var(--red);
            color: var(--red);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72em;
            cursor: pointer;
        }
        .add-row { display: flex; gap: 8px; margin-top: 16px; }
        .add-row input[type="text"] {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            outline: none;
        }
        .btn-add {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* HISTORY */
        .tbl-wrap { overflow-x: auto; background: var(--card); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 420px; }
        th, td { padding: 10px 7px; border-bottom: 1px solid #2a2a2a; text-align: center; font-size: 0.82em; }
        th { color: var(--accent); background: #252525; }
        .dcol { font-weight: bold; text-align: left; padding-left: 12px; background: #252525; }
        td.multi { font-size: 0.72em; line-height: 1.7; }
        .reset-btn {
            margin-top: 30px;
            color: var(--red);
            background: none;
            border: 1px solid var(--red);
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MODAL */
        .modal-bg {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-bg.open { display: flex; }
        .modal-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 22px;
            width: 88%;
            max-width: 320px;
        }
        .modal-box h3 { color: var(--accent); margin-bottom: 14px; font-size: 1em; }
        .modal-box input[type="text"] {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            padding: 11px;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            margin-bottom: 14px;
        }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 0.9em; }
        .mbtn-ok { background: var(--accent); color: #000; }
        .mbtn-cancel { background: #333; color: #aaa; }
    </style>
</head>
<body>

<!-- MAIN -->
<div id="view-main">
    <div class="header">
        <h2>Workout</h2>
        <div class="hbtns">
            <button id="progBtn" class="btn-prog" onclick="toggleProg()">Progressiv +2.5</button>
            <button class="btn-outline" onclick="goManage()">✏️ Übungen</button>
            <button class="btn-outline" onclick="goHistory()">📅 Verlauf</button>
        </div>
    </div>
    <div id="ex-list"></div>
    <button id="saveBtn" class="save-btn" onclick="saveWorkout()">Training speichern</button>
</div>

<!-- MANAGE -->
<div id="view-manage">
    <div class="header">
        <h2>Übungen verwalten</h2>
        <button class="btn-outline" onclick="goMain()">← Zurück</button>
    </div>
    <div id="manage-list"></div>
    <div class="add-row">
        <input type="text" id="newExName" placeholder="Neue Übung..." maxlength="28">
        <button class="btn-add" onclick="addEx()">+ Hinzufügen</button>
    </div>
</div>

<!-- HISTORY -->
<div id="view-history">
    <div class="header">
        <h2>Verlauf</h2>
        <button class="btn-outline" onclick="goMain()">← Zurück</button>
    </div>
    <div class="tbl-wrap">
        <table>
            <thead><tr id="h-head"></tr></thead>
            <tbody id="h-body"></tbody>
        </table>
    </div>
    <button class="reset-btn" onclick="clearHistory()">Verlauf leeren</button>
</div>

<!-- RENAME MODAL -->
<div id="modal" class="modal-bg">
    <div class="modal-box">
        <h3>Übung umbenennen</h3>
        <input type="text" id="renameVal" maxlength="28" placeholder="Neuer Name...">
        <div class="modal-btns">
            <button class="mbtn-cancel" onclick="closeModal()">Abbrechen</button>
            <button class="mbtn-ok" onclick="doRename()">Speichern</button>
        </div>
    </div>
</div>

<script>
    // ── State ──
    var DEFAULTS = ['Bankdrücken','Curls','Trizeps','Rudern','Butterfly revers','Butterfly'];
    var MAX_SETS = 9;

    function loadExercises() {
        try {
            var s = localStorage.getItem('exerciseOrder');
            if (s) { var a = JSON.parse(s); if (Array.isArray(a) && a.length > 0) return a; }
        } catch(e) {}
        return DEFAULTS.slice();
    }
    function loadHistory() {
        try { var s = localStorage.getItem('workoutHistory'); if (s) return JSON.parse(s); } catch(e) {}
        return [];
    }
    function loadLastWeights() {
        try { var s = localStorage.getItem('lastWeights'); if (s) return JSON.parse(s); } catch(e) {}
        return {};
    }

    var exercises    = loadExercises();
    var workoutLog      = loadHistory();
    var lastWeights  = loadLastWeights();
    var isProgressive = false;
    var currentSets  = {};   // { exName: [{weight}] }
    var renamingIdx  = null;

    function initSets() {
        exercises.forEach(function(ex) {
            if (!currentSets[ex]) currentSets[ex] = [];
        });
    }

    // ── Toggle Progressive ──
    function toggleProg() {
        isProgressive = !isProgressive;
        var btn = document.getElementById('progBtn');
        if (isProgressive) btn.classList.add('active'); else btn.classList.remove('active');
        renderExercises();
    }

    // ── Confirm Set ──
    function confirmSet(idx) {
        var ex = exercises[idx];
        var inp = document.getElementById('inp-' + idx);
        var val = inp.value.trim();
        if (val === '' && inp.placeholder && inp.placeholder !== '--') val = inp.placeholder;
        if (val === '' || val === '--') return;
        var sets = currentSets[ex] || [];
        if (sets.length >= MAX_SETS) return;
        sets.push({ weight: val });
        currentSets[ex] = sets;
        inp.value = '';

        // Update badge
        var badge = document.getElementById('badge-' + idx);
        badge.textContent = sets.length;
        if (sets.length > 0) badge.classList.remove('hide'); else badge.classList.add('hide');

        // Update dots
        renderDots(idx);

        // Update placeholder
        if (isProgressive && sets.length > 0) {
            inp.placeholder = sets[sets.length - 1].weight;
        }
    }

    function renderDots(idx) {
        var ex = exercises[idx];
        var sets = currentSets[ex] || [];
        var cont = document.getElementById('dots-' + idx);
        if (!cont) return;
        var html = '';
        for (var s = 0; s < MAX_SETS; s++) {
            if (s < sets.length) {
                var cls = isProgressive ? 'dot prog-done' : 'dot done';
                html += '<div class="' + cls + '">' + sets[s].weight + '</div>';
            } else {
                html += '<div class="dot">' + (s + 1) + '</div>';
            }
        }
        cont.innerHTML = html;
    }

    // ── Render all exercise cards ──
    function renderExercises() {
        initSets();
        var list = document.getElementById('ex-list');
        if (!list) return;
        list.innerHTML = '';

        exercises.forEach(function(ex, idx) {
            var lw = lastWeights[ex] || '--';
            var ph;
            if (isProgressive) {
                var lwf = parseFloat(lw);
                ph = (!isNaN(lwf) && lwf > 0) ? String(lwf + 2.5) : lw;
            } else {
                ph = lw;
            }

            var sets = currentSets[ex] || [];
            var count = sets.length;

            var nameClass = 'ex-name' + (isProgressive ? ' prog' : '');
            var badgeHide = count === 0 ? ' hide' : '';

            var dotsHTML = '';
            for (var s = 0; s < MAX_SETS; s++) {
                if (s < count) {
                    var dc = isProgressive ? 'dot prog-done' : 'dot done';
                    dotsHTML += '<div class="' + dc + '">' + sets[s].weight + '</div>';
                } else {
                    dotsHTML += '<div class="dot">' + (s + 1) + '</div>';
                }
            }

            var card = document.createElement('div');
            card.className = 'ex-card';
            card.innerHTML =
                '<div class="card-top">' +
                    '<div class="ex-info">' +
                        '<div class="name-row">' +
                            '<span class="' + nameClass + '" title="' + ex + '">' + ex + '</span>' +
                            '<span id="badge-' + idx + '" class="badge' + badgeHide + '">' + (count || 0) + '</span>' +
                        '</div>' +
                        '<div class="last-w">Zuletzt: ' + lw + ' kg</div>' +
                    '</div>' +
                    '<div class="input-row">' +
                        '<input type="number" id="inp-' + idx + '" data-ex="' + ex + '" ' +
                               'value="" placeholder="' + ph + '" step="0.5" inputmode="decimal">' +
                        '<button class="check-btn" onclick="confirmSet(' + idx + ')">✔</button>' +
                    '</div>' +
                '</div>' +
                '<div class="dots-row" id="dots-' + idx + '">' + dotsHTML + '</div>';

            list.appendChild(card);
        });
    }

    // ── Save ──
    function saveWorkout() {
        // Grab any un-confirmed input
        exercises.forEach(function(ex, idx) {
            var inp = document.getElementById('inp-' + idx);
            if (!inp) return;
            var val = inp.value.trim();
            if (val !== '') {
                var sets = currentSets[ex] || [];
                if (sets.length < MAX_SETS) { sets.push({ weight: val }); currentSets[ex] = sets; }
                inp.value = '';
            }
        });

        var hasEntry = exercises.some(function(ex) { return (currentSets[ex] || []).length > 0; });
        if (!hasEntry) return;

        var date = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        var session = { date: date, weights: {} };

        exercises.forEach(function(ex) {
            var sets = currentSets[ex] || [];
            if (sets.length > 0) {
                session.weights[ex] = sets.map(function(s) { return s.weight; });
                lastWeights[ex] = sets[sets.length - 1].weight;
            } else {
                session.weights[ex] = null;
            }
        });

        workoutLog.unshift(session);
        try { localStorage.setItem('workoutHistory', JSON.stringify(workoutLog)); } catch(e) {}
        try { localStorage.setItem('lastWeights', JSON.stringify(lastWeights)); } catch(e) {}

        currentSets = {};
        initSets();

        var btn = document.getElementById('saveBtn');
        btn.classList.add('ok');
        btn.textContent = 'Gespeichert! ✓';
        setTimeout(function() {
            btn.classList.remove('ok');
            btn.textContent = 'Training speichern';
            renderExercises();
        }, 1000);
    }

    // ── Views ──
    function show(id) {
        ['view-main','view-manage','view-history'].forEach(function(v) {
            document.getElementById(v).style.display = 'none';
        });
        document.getElementById(id).style.display = 'block';
    }

    function goMain() {
        show('view-main');
        initSets();
        renderExercises();
    }

    function goManage() {
        show('view-manage');
        renderManage();
    }

    function goHistory() {
        show('view-history');
        renderHistory();
    }

    // ── Manage ──
    function renderManage() {
        var c = document.getElementById('manage-list');
        c.innerHTML = '';
        exercises.forEach(function(ex, idx) {
            var item = document.createElement('div');
            item.className = 'manage-item';
            item.innerHTML =
                '<span>' + ex + '</span>' +
                '<button class="btn-edit" onclick="openModal(' + idx + ')">✏️ Umbenennen</button>' +
                '<button class="btn-del" onclick="delEx(' + idx + ')">🗑</button>';
            c.appendChild(item);
        });
    }

    function addEx() {
        var inp = document.getElementById('newExName');
        var name = inp.value.trim();
        if (!name) return;
        if (exercises.indexOf(name) !== -1) { alert('Übung existiert bereits'); return; }
        exercises.push(name);
        saveExList();
        inp.value = '';
        renderManage();
    }

    function delEx(idx) {
        if (exercises.length <= 1) return;
        if (!confirm('"' + exercises[idx] + '" löschen?')) return;
        exercises.splice(idx, 1);
        saveExList();
        renderManage();
    }

    function saveExList() {
        try { localStorage.setItem('exerciseOrder', JSON.stringify(exercises)); } catch(e) {}
    }

    // ── Rename Modal ──
    function openModal(idx) {
        renamingIdx = idx;
        document.getElementById('renameVal').value = exercises[idx];
        document.getElementById('modal').classList.add('open');
    }
    function closeModal() {
        renamingIdx = null;
        document.getElementById('modal').classList.remove('open');
    }
    function doRename() {
        var newName = document.getElementById('renameVal').value.trim();
        if (!newName || renamingIdx === null) return;
        var old = exercises[renamingIdx];
        if (lastWeights[old] !== undefined) {
            lastWeights[newName] = lastWeights[old];
            delete lastWeights[old];
            try { localStorage.setItem('lastWeights', JSON.stringify(lastWeights)); } catch(e) {}
        }
        exercises[renamingIdx] = newName;
        saveExList();
        closeModal();
        renderManage();
    }

    // ── History ──
    function renderHistory() {
        var head = document.getElementById('h-head');
        head.innerHTML = '<th>Datu
